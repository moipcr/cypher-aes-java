name: Construir y Publicar Ejecutable Java

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Permite la ejecución manual desde la pestaña Actions

jobs:
  build-and-release:
    name: Construir y Liberar
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para crear un Release

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK (Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25' # Cambia a tu versión de Java (ej. 11, 17, etc.)
          cache: 'maven'

      - name: Construir proyecto con Maven
        run: mvn clean package -DskipTests

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/*.jar # Sube todos los archivos .jar generados
          generate_release_notes: true
