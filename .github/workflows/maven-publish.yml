name: Construir Instalador Swing

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows-installer:
    name: Crear Instalador Windows (.exe)
    runs-on: windows-latest # Cambiamos a Windows para poder generar el instalador .exe
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK (Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Construir JAR con Maven
        run: mvn clean package -DskipTests

      - name: Extraer información del JAR
        shell: bash
        run: |
          # Busca el archivo JAR generado en la carpeta target
          JAR_FILE=$(basename target/*.jar)
          echo "JAR_NAME=$JAR_FILE" >> $GITHUB_ENV
          echo "Detectado JAR: $JAR_FILE"

      - name: Generar Instalador Nativo con jpackage
        shell: bash
        run: |
          # jpackage empaqueta el JAR junto con un entorno Java (JRE) mínimo para Swing
          jpackage \
            --type exe \
            --input target/ \
            --main-jar "${{ env.JAR_NAME }}" \
            --name "MiAplicacionSwing" \
            --app-version "1.0.0" \
            --vendor "MiNombreOEmpresa" \
            --dest dist/ \
            --win-shortcut \
            --win-menu

      - name: Publicar Release mediante API de GitHub
        shell: bash
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Detectar si es un tag real o una ejecución manual para asignarle un nombre válido
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.0-manual-${GITHUB_RUN_NUMBER}"
          fi
          
          echo "Creando Release para el tag: $TAG_NAME"
          
          # 2. Crear la release de forma nativa en GitHub incluyendo la generación de documentación
          RELEASE_JSON=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+v3+json" \
            https://github.com{{ github.repository }}/releases \
            -d "{\"tag_name\":\"$TAG_NAME\",\"name\":\"Release $TAG_NAME\",\"draft\":false,\"prerelease\":false,\"generate_release_notes\":true}")
          
          # 3. Extraer el ID único de la release generada por el servidor
          RELEASE_ID=$(echo "$RELEASE_JSON" | grep -m 1 '"id":' | sed 's/[^0-9]//g')
          
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" -eq 0 ]; then
            echo "❌ Error crítico: La API de GitHub rechazó la creación de la Release."
            echo "Respuesta del servidor:"
            echo "$RELEASE_JSON"
            exit 1
          fi
          
          # 4. Localizar y subir el instalador .exe generado a la release
          EXE_PATH=$(ls dist/*.exe | head -n 1)
          EXE_NAME=$(basename "$EXE_PATH")
          
          echo "Subiendo asset: $EXE_NAME"
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$EXE_PATH" \
            "https://github.com{{ github.repository }}/releases/$RELEASE_ID/assets?name=$EXE_NAME"
          
          echo "✅ Proceso completado con éxito. Ejecutable publicado."

