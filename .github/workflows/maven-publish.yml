name: Construir Instalador Swing

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows-installer:
    name: Crear Instalador Windows (.exe)
    runs-on: windows-latest # Cambiamos a Windows para poder generar el instalador .exe
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK (Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Construir JAR con Maven
        run: mvn clean package -DskipTests

      - name: Extraer información del JAR
        shell: bash
        run: |
          # Busca el archivo JAR generado en la carpeta target
          JAR_FILE=$(basename target/*.jar)
          echo "JAR_NAME=$JAR_FILE" >> $GITHUB_ENV
          echo "Detectado JAR: $JAR_FILE"

      - name: Generar Instalador Nativo con jpackage
        shell: bash
        run: |
          # jpackage empaqueta el JAR junto con un entorno Java (JRE) mínimo para Swing
          jpackage \
            --type exe \
            --input target/ \
            --main-jar "${{ env.JAR_NAME }}" \
            --name "MiAplicacionSwing" \
            --app-version "1.0.0" \
            --vendor "MiNombreOEmpresa" \
            --dest dist/ \
            --win-shortcut \
            --win-menu

      - name: Publicar Release mediante GitHub CLI
        shell: bash
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Asignar nombre de etiqueta según el tipo de ejecución
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.0-manual-${GITHUB_RUN_NUMBER}"
          fi
          
          echo "Creando Release oficial para: $TAG_NAME"
          
          # 2. Localizar el archivo ejecutable compilado
          EXE_PATH=$(ls dist/*.exe | head -n 1)
          
          # 3. Crear lanzamiento y adjuntar archivo usando la herramienta integrada de GitHub
          gh release create "$TAG_NAME" "$EXE_PATH" \
            --title "Release $TAG_NAME" \
            --notes "Compilación automática de la aplicación Swing." \
            --generate-notes
          
          echo "✅ ¡Lanzamiento publicado con éxito en la pestaña Releases!"
